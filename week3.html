<body>

<header>

<div class="container">

<div class="card">
<h2>Select a Mission</h2>

<button class="missionBtn" onclick="loadMission(7)">
🦪 Mission 7 — Zebra Mussel Invasion
</button>

<button class="missionBtn" onclick="loadMission(8)">
🪨 Mission 8 — North Shore Freeze–Thaw
</button>

🛶 Mission 9 — Boundary Waters Forces
</button>

</div>

<div id="missionArea"></div>

</div>

<script>

/* =============================
   WEEK 3 MISSION BANK
============================= */

const missionBank = {

/* 7 */
7: {
title: "Mission 7: Zebra Mussel Invasion",
scenario:
"<p>Over the past decade, zebra mussels have spread to several Minnesota lakes. Scientists observed that as zebra mussel populations increased, native mussel populations declined significantly.</p>" +
"<table>" +
"<tr><th>Year</th><th>Native Mussel Population Index</th></tr>" +
"<tr><td>1</td><td>100</td></tr>" +
"<tr><td>3</td><td>92</td></tr>" +
"<tr><td>5</td><td>75</td></tr>" +
"<tr><td>7</td><td>60</td></tr>" +
"<tr><td>10</td><td>45</td></tr>" +
"</table>",
questions: [
{
q: "Which statement best describes the trend in native mussel populations?",
options: [
"Native mussel populations increased over time.",
"Native mussel populations decreased over time.",
"Native mussel populations remained constant.",
"Native mussel populations changed randomly."
],
correct: 1,
explanation: "The population index decreases steadily from 100 to 45."
},
{
q: "Which explanation best accounts for the decline in native mussels?",
options: [
"Zebra mussels compete for food and habitat resources.",
"Zebra mussels increase oxygen levels in the lake.",
"Native mussels stop interacting with water.",
"Zebra mussels eliminate sunlight."
],
correct: 0,
explanation: "Invasive zebra mussels compete for limited resources."
},
{
q: "How might declining native mussels affect the lake ecosystem?",
options: [
"Changes in water clarity and nutrient cycling.",
"The lake permanently freezes.",
"All fish disappear instantly.",
"The lake becomes saltwater."
],
correct: 0,
explanation: "Mussels influence nutrient flow and water quality."
},
{
q: "Which conclusion is most reasonable?",
options: [
"The ecosystem may experience long-term instability.",
"The ecosystem remains perfectly stable.",
"The lake permanently disappears.",
"No measurable effect occurs."
],
correct: 0,
explanation: "Reduced biodiversity can destabilize ecosystems."
}
]
},

/* 8 */
8: {
title: "Mission 8: North Shore Freeze–Thaw",
scenario:
"<p>Along Minnesota’s North Shore of Lake Superior, cliffs experience repeated freezing and thawing during fall and spring. Water enters cracks in rock during warm days and freezes overnight, expanding and widening the cracks.</p>" +
"<table>" +
"<tr><th>Day</th><th>High Temp (°C)</th><th>Low Temp (°C)</th></tr>" +
"<tr><td>1</td><td>3</td><td>-4</td></tr>" +
"<tr><td>2</td><td>5</td><td>-2</td></tr>" +
"<tr><td>3</td><td>4</td><td>-3</td></tr>" +
"<tr><td>4</td><td>6</td><td>-1</td></tr>" +
"<tr><td>5</td><td>2</td><td>-5</td></tr>" +
"</table>",
questions: [
{
q: "Which statement best describes the temperature pattern during the week?",
options: [
"Temperatures remained below freezing all week.",
"Temperatures remained above freezing all week.",
"Temperatures fluctuated above and below freezing each day.",
"Temperatures steadily increased."
],
correct: 2,
explanation: "Temperatures repeatedly cross the freezing point."
},
{
q: "Why do cracks in rock widen during freeze–thaw cycles?",
options: [
"Water expands when it freezes.",
"Ice shrinks when frozen.",
"Wind melts rock.",
"Sunlight freezes water."
],
correct: 0,
explanation: "Water expands as it freezes, increasing pressure."
},
{
q: "Which conclusion is most reasonable about the cliffs over time?",
options: [
"The cliffs remain completely unchanged.",
"Repeated freeze–thaw cycles may gradually destabilize the cliffs.",
"The cliffs instantly collapse after one freeze.",
"Temperature changes prevent rock movement."
],
correct: 1,
explanation: "Repeated stress weakens rock structures."
},
{
q: "How might increased freeze–thaw activity affect Lake Superior?",
options: [
"Increased sediment entering the lake.",
"The lake permanently disappears.",
"The lake freezes year-round.",
"No interaction occurs."
],
correct: 0,
explanation: "Weathering can increase sediment entering water systems."
}
]
},

/* 9 */
9: {
title: "Mission 9: Boundary Waters Canoe Forces",
scenario:
"<p>During a science field trip in Minnesota’s Boundary Waters, students measured how wind and paddling forces affected canoe movement. Two paddlers pushed forward while wind pushed against the canoe.</p>",
questions: [
{
q: "If Student A paddles with 50 N and Student B paddles with 50 N forward, what is the total forward force?",
options: [
"0 N",
"50 N",
"100 N",
"150 N"
],
correct: 2,
explanation: "50 N + 50 N = 100 N forward force."
},
{
q: "If wind pushes backward with 100 N, what is the net force on the canoe?",
options: [
"0 N",
"100 N forward",
"100 N backward",
"200 N forward"
],
correct: 0,
explanation: "Equal and opposite forces cancel out."
},
{
q: "Based on the net force, how will the canoe move?",
options: [
"It will accelerate forward.",
"It will accelerate backward.",
"It will remain at constant velocity.",
"It will spin."
],
correct: 2,
explanation: "Balanced forces cause no acceleration."
},
{
q: "If wind increases to 150 N, what will happen?",
options: [
"The canoe accelerates backward.",
"The canoe accelerates forward.",
"The forces remain balanced.",
"The canoe stops interacting with wind."
],
correct: 0,
explanation: "150 N backward is greater than 100 N forward."
}
]
}
};

/* =============================
   ENGINE
============================= */

function loadMission(id){
let m = missionBank[id];
let html = `<div class="card"><h2>${m.title}</h2>${m.scenario}`;

m.questions.forEach((q,i)=>{
html+=`<p><strong>Q${i+1}: ${q.q}</strong></p>`;
q.options.forEach((opt,index)=>{
html+=`<input type="radio" name="q${i}" value="${index}"> ${opt}<br>`;
});
});

html+=`<button onclick="submitMission(${id})">Submit Mission</button></div>`;
document.getElementById("missionArea").innerHTML = html;
}

function submitMission(id){
let m = missionBank[id];
let correctCount=0;
let reviewHTML="<div class='card'><h2>Mission Review</h2>";

m.questions.forEach((q,i)=>{
let selected=document.querySelector(`input[name="q${i}"]:checked`);
let answer=selected?parseInt(selected.value):-1;

if(answer===q.correct){correctCount++;}

reviewHTML+=`
<div class="reviewBox">
<strong>Q${i+1}</strong><br>
Correct Answer: ${q.options[q.correct]}<br>
🧠 ${q.explanation}
</div>`;
});

reviewHTML+=`Score: ${correctCount}/${m.questions.length}<br>
<button onclick="loadMission(${id})">Retake</button>
<button onclick="document.getElementById('missionArea').innerHTML=''">Back</button>
</div>`;

document.getElementById("missionArea").innerHTML = reviewHTML;
}

</script>

</body>
</html>
